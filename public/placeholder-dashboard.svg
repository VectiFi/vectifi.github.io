<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A8C62;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7DC4A0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#FAFAFA"/>

  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#0B3D22" text-anchor="middle">Turn raw data into decisions</text>

  <!-- Stage 1: Raw Data -->
  <g transform="translate(100, 200)">
    <rect width="250" height="400" rx="16" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="125" y="40" font-family="system-ui" font-size="18" font-weight="600" fill="#6B7280" text-anchor="middle">Raw Data</text>
    <rect x="30" y="80" width="190" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="50" y="105" width="150" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="40" y="130" width="170" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="30" y="155" width="190" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="60" y="180" width="140" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="30" y="220" width="190" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="50" y="245" width="150" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="40" y="270" width="170" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="30" y="310" width="190" height="12" rx="4" fill="#E5E7EB"/>
    <rect x="60" y="335" width="140" height="12" rx="4" fill="#E5E7EB"/>
    <circle cx="80" cy="210" r="3" fill="#9CA3AF"/>
    <circle cx="120" cy="200" r="3" fill="#9CA3AF"/>
    <circle cx="160" cy="295" r="3" fill="#9CA3AF"/>
    <circle cx="100" cy="360" r="3" fill="#9CA3AF"/>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(370, 380)">
    <path d="M 0 0 L 60 0 L 60 -8 L 80 8 L 60 24 L 60 16 L 0 16 Z" fill="url(#greenGradient)"/>
    <text x="40" y="-15" font-family="system-ui" font-size="12" font-weight="500" fill="#1A8C62" text-anchor="middle">AI Processing</text>
  </g>

  <!-- Stage 2: Analysis -->
  <g transform="translate(475, 200)">
    <rect width="250" height="400" rx="16" fill="#FFFFFF" stroke="#1A8C62" stroke-width="3"/>
    <text x="125" y="40" font-family="system-ui" font-size="18" font-weight="600" fill="#1A8C62" text-anchor="middle">VectiFi Analytics</text>
    <rect x="40" y="70" width="20" height="60" rx="4" fill="#7DC4A0" opacity="0.8"/>
    <rect x="70" y="60" width="20" height="70" rx="4" fill="#7DC4A0" opacity="0.9"/>
    <rect x="100" y="50" width="20" height="80" rx="4" fill="#1A8C62"/>
    <rect x="130" y="45" width="20" height="85" rx="4" fill="#0B4A30"/>
    <polyline points="40,180 70,170 100,155 130,150 160,140 190,135" fill="none" stroke="#1A8C62" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="180" r="4" fill="#1A8C62"/>
    <circle cx="70" cy="170" r="4" fill="#1A8C62"/>
    <circle cx="100" cy="155" r="4" fill="#1A8C62"/>
    <circle cx="130" cy="150" r="4" fill="#1A8C62"/>
    <circle cx="160" cy="140" r="4" fill="#1A8C62"/>
    <circle cx="190" cy="135" r="4" fill="#1A8C62"/>
    <circle cx="125" cy="260" r="50" fill="none" stroke="#E5E7EB" stroke-width="2"/>
    <path d="M 125 210 L 125 260 L 168 230 A 50 50 0 0 0 125 210 Z" fill="#1A8C62"/>
    <path d="M 125 260 L 168 230 A 50 50 0 0 0 82 230 Z" fill="#7DC4A0"/>
    <path d="M 125 260 L 82 230 A 50 50 0 0 0 125 210 Z" fill="#E6F9F1"/>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(745, 380)">
    <path d="M 0 0 L 60 0 L 60 -8 L 80 8 L 60 24 L 60 16 L 0 16 Z" fill="url(#greenGradient)"/>
    <text x="40" y="-15" font-family="system-ui" font-size="12" font-weight="500" fill="#1A8C62" text-anchor="middle">Insights</text>
  </g>

  <!-- Stage 3: Decisions -->
  <g transform="translate(850, 200)">
    <rect width="250" height="400" rx="16" fill="#0B4A30" stroke="#0B4A30" stroke-width="2"/>
    <text x="125" y="40" font-family="system-ui" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Actionable Decisions</text>
    <g transform="translate(25, 70)">
      <rect width="200" height="80" rx="12" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="25" cy="25" r="12" fill="#1A8C62"/>
      <text x="40" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#0B3D22">Optimize pricing</text>
      <text x="40" y="40" font-family="system-ui" font-size="11" fill="#6B7280">+15% margin potential</text>
      <text x="40" y="55" font-family="system-ui" font-size="11" fill="#6B7280">High confidence</text>
    </g>
    <g transform="translate(25, 170)">
      <rect width="200" height="80" rx="12" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="25" cy="25" r="12" fill="#1A8C62"/>
      <text x="40" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#0B3D22">Expand channel</text>
      <text x="40" y="40" font-family="system-ui" font-size="11" fill="#6B7280">20% growth opportunity</text>
      <text x="40" y="55" font-family="system-ui" font-size="11" fill="#6B7280">Ready to execute</text>
    </g>
    <g transform="translate(25, 270)">
      <rect width="200" height="80" rx="12" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="25" cy="25" r="12" fill="#FCD34D"/>
      <text x="40" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#0B3D22">Review costs</text>
      <text x="40" y="40" font-family="system-ui" font-size="11" fill="#6B7280">Expenses trending up</text>
      <text x="40" y="55" font-family="system-ui" font-size="11" fill="#6B7280">Needs attention</text>
    </g>
  </g>

  <text x="600" y="720" font-family="system-ui" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">No SQL. No spreadsheets. No analyst bottleneck.</text>
  <text x="600" y="760" font-family="system-ui" font-size="24" font-weight="600" fill="#0B4A30" text-anchor="middle">Just instant, AI-powered business intelligence.</text>
</svg>
