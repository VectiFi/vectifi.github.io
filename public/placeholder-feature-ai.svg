<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A8C62;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7DC4A0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1A8C62;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#1A8C62;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#F2F7F4"/>

  <circle cx="600" cy="450" r="320" fill="url(#orbGlow)"/>

  <!-- Question bubble (top-right) -->
  <g transform="translate(720, 180)">
    <rect width="320" height="110" rx="30" fill="#FFFFFF"/>
    <rect width="320" height="110" rx="30" fill="none" stroke="#E2EDE7" stroke-width="2"/>
    <path d="M 60 110 L 90 110 L 60 150 Z" fill="#FFFFFF"/>
    <rect x="40" y="38" width="180" height="14" rx="7" fill="#CDE3D8"/>
    <rect x="40" y="66" width="120" height="14" rx="7" fill="#CDE3D8"/>
  </g>

  <!-- Central AI orb with radiating nodes -->
  <g transform="translate(600, 450)">
    <line x1="0" y1="0" x2="-210" y2="-120" stroke="#7DC4A0" stroke-width="3"/>
    <line x1="0" y1="0" x2="220" y2="-150" stroke="#7DC4A0" stroke-width="3"/>
    <line x1="0" y1="0" x2="-240" y2="110" stroke="#7DC4A0" stroke-width="3"/>
    <line x1="0" y1="0" x2="230" y2="120" stroke="#7DC4A0" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#7DC4A0" stroke-width="3"/>

    <circle cx="-210" cy="-120" r="14" fill="#7DC4A0"/>
    <circle cx="220" cy="-150" r="14" fill="#7DC4A0"/>
    <circle cx="-240" cy="110" r="14" fill="#7DC4A0"/>
    <circle cx="230" cy="120" r="14" fill="#7DC4A0"/>
    <circle cx="0" cy="-200" r="14" fill="#7DC4A0"/>

    <circle cx="0" cy="0" r="92" fill="url(#aiGrad)"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>

    <!-- Spark mark inside orb -->
    <path d="M 0 -46 L 12 -12 L 46 0 L 12 12 L 0 46 L -12 12 L -46 0 L -12 -12 Z" fill="#FFFFFF"/>
    <path d="M 40 -52 L 46 -36 L 62 -30 L 46 -24 L 40 -8 L 34 -24 L 18 -30 L 34 -36 Z" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Answer bubble (bottom-left) -->
  <g transform="translate(180, 600)">
    <rect width="420" height="150" rx="30" fill="#0B4A30"/>
    <path d="M 360 150 L 330 150 L 360 190 Z" fill="#0B4A30"/>
    <rect x="40" y="40" width="340" height="14" rx="7" fill="#7DC4A0"/>
    <rect x="40" y="70" width="300" height="14" rx="7" fill="#4E9E78"/>
    <rect x="40" y="100" width="220" height="14" rx="7" fill="#4E9E78"/>
  </g>
</svg>
